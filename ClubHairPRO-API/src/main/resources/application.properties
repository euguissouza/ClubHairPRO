spring.application.name=ClubHairPRO-API
spring.datasource.url=jdbc:h2:file:./data/clubhairdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações do Hibernate / JPA
# Use 'update' para que ele apenas altere a estrutura sem apagar os dados existentes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console do H2 (Acessível em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Permite que o console seja acessado mesmo se você usar Spring Security no futuro
spring.h2.console.settings.web-allow-others=true